{% extends "base.html" %}

{% block content %}
<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="{% url 'ad:categories' %}">Категории</a></li>
        <li class="breadcrumb-item"><a href="{% url 'ad:category_details' product.category.id %}">{{
            product.category.name }}</a></li>
        <li class="breadcrumb-item active">{{ product.name }}</li>
    </ol>
</nav>

<div class="card shadow-sm">
    <div class="card-body p-4 d-flex gap-4 flex-wrap">
        <img src="{{ product.image_url.url }}" alt="" class="product-image">
        <div>
            <h1 class="fs-2 mb-2">{{ product.name }}</h1>
            <p class="text-secondary">{{ product.description }}</p>
            <p class="fs-4 fw-bold mb-1">{{ product.price }}</p>
            <p class="text-secondary m-0">Категория: {{ product.category.name }}</p>
        </div>
    </div>
</div>

<div class="d-flex gap-2 mt-4">
    <a href="{% url 'ad:product_edit' product.category.id product.id %}" class="btn btn-primary">Редактировать</a>
    <a href="{% url 'ad:category_details' product.category.id %}" class="btn btn-outline-secondary">Назад</a>
</div>
{% endblock %}
